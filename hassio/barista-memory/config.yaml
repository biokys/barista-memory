name: Barista Memory
version: "0.3.0"
slug: barista_memory
description: Shot archive and brewing context for a GaggiMate espresso machine
url: https://github.com/biokys/barista-memory
arch:
  - aarch64
  - amd64
image: ghcr.io/biokys/barista-memory-{arch}
startup: services
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:coffee
panel_title: Barista Memory
# Direct LAN access on top of ingress, off unless the user maps it.
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Web UI without Home Assistant login (LAN only)
# Mosquitto's credentials come from the Supervisor when it is installed.
services:
  - mqtt:want
# The receipt printer is Bluetooth LE, reached through the host's BlueZ.
host_dbus: true
options:
  machine_host: ""
  poll_interval: 30
  sync_notes: true
  ready_percent: 85
  mqtt_url: ""
  mqtt_user: ""
  mqtt_password: ""
  mcp_token: ""
  printer_mac: ""
  language: "en"
  web_url: ""
schema:
  machine_host: str
  poll_interval: int(5,600)
  sync_notes: bool
  ready_percent: int(50,100)
  mqtt_url: str?
  mqtt_user: str?
  mqtt_password: password?
  mcp_token: password?
  printer_mac: str?
  language: list(en|cs)
  web_url: str?
