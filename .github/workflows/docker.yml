# Builds the container image on every release tag and publishes it to GHCR:
#   ghcr.io/biokys/barista-memory:<version>          multi-arch manifest (amd64, arm64)
#   ghcr.io/biokys/barista-memory-amd64:<version>    per-arch aliases for the
#   ghcr.io/biokys/barista-memory-aarch64:<version>  Home Assistant add-on ({arch})
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/barista-memory

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from the tag
        id: v
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_COMMIT=${{ steps.v.outputs.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Home Assistant substitutes {arch} in the add-on's image name, so it
      # needs one image name per architecture; these reuse the cached layers.
      - name: amd64 alias
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_COMMIT=${{ steps.v.outputs.sha }}
          push: true
          tags: ${{ env.IMAGE }}-amd64:${{ steps.v.outputs.version }}
          cache-from: type=gha
      - name: aarch64 alias
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: GIT_COMMIT=${{ steps.v.outputs.sha }}
          push: true
          tags: ${{ env.IMAGE }}-aarch64:${{ steps.v.outputs.version }}
          cache-from: type=gha
